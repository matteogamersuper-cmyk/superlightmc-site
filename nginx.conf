server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # Disabilita la cache per i file dinamici
    location ~* \.(php|html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Gestione delle richieste
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Gestione dei file PHP (IMPORTANTE!)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Reindirizzamento per /home
    location = /home {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reindirizzamento per /rules
    location = /rules {
        try_files $uri $uri/ /rules.php?$query_string;
    }

    # Disabilita la visualizzazione della directory
    autoindex off;
}

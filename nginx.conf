server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html index.htm;

    # Abilita la compressione
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Gestione della cache per i file statici
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gestione delle richieste per il sito
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Gestione dei file PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Reindirizzamento per /home
    location = /home {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reindirizzamento per /rules
    location = /rules {
        try_files $uri $uri/ /rules.php?$query_string;
    }

    # Disabilita la visualizzazione della directory
    autoindex off;

    # Errori 404 e 500 personalizzati (opzionale)
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

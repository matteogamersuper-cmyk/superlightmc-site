server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Gestione delle richieste per il sito
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Gestione dei file PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Reindirizzamento per /home
    location = /home {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reindirizzamento per /rules
    location = /rules {
        try_files $uri $uri/ /rules.php?$query_string;
    }

    # Disabilita la visualizzazione della directory
    location / {
        autoindex off;
    }
}
